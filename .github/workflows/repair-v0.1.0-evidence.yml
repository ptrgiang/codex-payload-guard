name: Repair v0.1.0 Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-v0.1.0-evidence.yml"

permissions:
  contents: write

jobs:
  repair-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tagged release
        run: python -m pip install -e ".[dev]"
      - name: Regenerate full release evidence
        run: cpg benchmark --profile full --report-dir benchmark-results
      - name: Attach evidence to v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v0.1.0" \
            benchmark-results/benchmark-results.json \
            benchmark-results/benchmark-results.md \
            --repo "${{ github.repository }}" \
            --clobber
