name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: CLI smoke test
        run: cpg --help
      - name: Benchmark harness and evidence
        if: matrix.python-version == '3.12'
        run: |
          cpg benchmark --profile ci --report-dir benchmark-ci
          test -s benchmark-ci/benchmark-results.json
          test -s benchmark-ci/benchmark-results.md
          python -m json.tool benchmark-ci/benchmark-results.json > /dev/null
