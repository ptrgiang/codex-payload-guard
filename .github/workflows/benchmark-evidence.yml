name: Benchmark Evidence

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  full-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run full benchmark
        run: cpg benchmark --profile full --report-dir benchmark-results
      - name: Publish benchmark summary
        run: cat benchmark-results/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-${{ github.sha }}
          path: benchmark-results/
          retention-days: 90
      - name: Attach evidence to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            benchmark-results/benchmark-results.json \
            benchmark-results/benchmark-results.md \
            --clobber
