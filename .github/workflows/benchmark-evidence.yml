name: Benchmark Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/codex_payload_guard/benchmark*.py"
      - "src/codex_payload_guard/benchmark_scenarios/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark-evidence.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  full-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run full benchmark
        run: cpg benchmark --profile full --report-dir benchmark-results
      - name: Publish benchmark summary
        run: cat benchmark-results/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence-${{ github.sha }}
          path: benchmark-results/
          retention-days: 90

  attach-release:
    if: github.event_name == 'release'
    needs: full-benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download benchmark evidence artifact
        uses: actions/download-artifact@v8
        with:
          name: benchmark-evidence-${{ github.sha }}
          path: benchmark-results
      - name: Attach evidence to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            benchmark-results/benchmark-results.json \
            benchmark-results/benchmark-results.md \
            --clobber
